# ==============================================================================
# Custom Nginx Configuration File (config/nginx.conf)
# Isolated user-space runtime configuration (non-privileged port 8080)
# Multi-worker + Custom Security & Custom Monitoring Modules enabled
# ==============================================================================

worker_processes  2;

error_log  logs/error.log info;
pid        logs/nginx.pid;

events {
    worker_connections  1024;
    use                 epoll;
    multi_accept        on;
}

http {
    default_type  application/octet-stream;

    # Shared memory zone size for ngx_http_custom_security_module
    custom_security_shm_size 2m;

    log_format  custom_main  '$remote_addr - $remote_user [$time_local] "$request" '
                             '$status $body_bytes_sent "$http_referer" '
                             '"$http_user_agent" pid=$pid';

    access_log  logs/access.log  custom_main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    # Isolated temporary directories inside build prefix
    client_body_temp_path build/client_body_temp;
    proxy_temp_path       build/proxy_temp;
    fastcgi_temp_path     build/fastcgi_temp;
    uwsgi_temp_path       build/uwsgi_temp;
    scgi_temp_path        build/scgi_temp;

    server {
        listen       8080;
        listen       [::]:8080;
        server_name  localhost;

        # Root directory mapped to project web/ folder with Custom Security enabled
        location / {
            custom_security on;
            custom_security_limit 20;
            custom_security_window 1s;

            root   /home/truongphuoc/Desktop/custom-nginx-project/web;
            index  index.html index.htm;
        }

        # Real-time JSON Monitoring Endpoint (localhost + configured admin IPs only)
        location = /custom_status {
            custom_status on;
            custom_status_allow 10.10.0.1;
            custom_status_allow 192.168.100.0/24;
        }

        # Restricted test endpoint simulating external/unauthorized access (localhost disabled, only 10.10.0.1 allowed)
        location = /custom_status_admin_only {
            custom_status on;
            custom_status_localhost off;
            custom_status_allow 10.10.0.1;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /home/truongphuoc/Desktop/custom-nginx-project/web;
        }
    }
}
